[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comsol-mcp-unified"
version = "0.1.0"
description = "Unified, modular Model Context Protocol (MCP) server for COMSOL Multiphysics combining warm mph sessions, native batch jobs, Windows Desktop GUI automation, offline API catalog, physics validation, RAG docs, and dry-run codegen."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["comsol", "multiphysics", "mcp", "simulation", "fea", "automation", "rag"]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
mph = [
    "mph>=1.3.0",
    "jpype1>=1.5.0",
]
gui = [
    "pywinauto>=0.6.8; platform_system == 'Windows'",
    "pywin32>=306; platform_system == 'Windows'",
    "pyperclip>=1.8",
    "psutil>=5.9",
    "Pillow>=10.0",
]
rag-local = [
    "pymupdf>=1.24.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
rag-api = [
    "pymupdf>=1.24.0",
    "chromadb>=0.4.0",
]
all = [
    "mph>=1.3.0",
    "jpype1>=1.5.0",
    "pywinauto>=0.6.8; platform_system == 'Windows'",
    "pywin32>=306; platform_system == 'Windows'",
    "pyperclip>=1.8",
    "psutil>=5.9",
    "Pillow>=10.0",
    "pymupdf>=1.24.0",
    "chromadb>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
comsol-mcp = "comsol_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comsol_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-q"
